<div class="modal-backdrop" onclick="if (event.target === this) this.remove()">
<div class="modal">
  <div class="modal-header">
    <h3 class="modal-title">Create API Key</h3>
    <button class="modal-close" onclick="this.closest('.modal-backdrop').remove()" aria-label="Close modal">&times;</button>
  </div>
  <form id="add-api-key-form" onsubmit="submitCreateApiKey(event)">
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="api-key-name">Name <span class="text-critical">*</span></label>
        <input type="text" id="api-key-name" name="name" class="form-input"
               placeholder="e.g., CI/CD Pipeline, External Integration"
               required maxlength="100">
        <p class="text-xs text-muted mt-1">A descriptive name to identify this key's purpose.</p>
      </div>

      <div class="form-group mt-4">
        <label class="form-label">Scopes <span class="text-critical">*</span></label>
        <p class="text-xs text-muted mb-2">Select the permissions this API key should have.</p>
        <div class="grid grid-2 gap-2">
          <label class="flex items-center gap-2 p-2 bg-surface rounded cursor-pointer hover:bg-surface-hover">
            <input type="checkbox" name="scopes" value="read">
            <div>
              <span class="font-medium">read</span>
              <p class="text-xs text-muted">Read access to incidents and data</p>
            </div>
          </label>
          <label class="flex items-center gap-2 p-2 bg-surface rounded cursor-pointer hover:bg-surface-hover">
            <input type="checkbox" name="scopes" value="write">
            <div>
              <span class="font-medium">write</span>
              <p class="text-xs text-muted">Create and update resources</p>
            </div>
          </label>
          <label class="flex items-center gap-2 p-2 bg-surface rounded cursor-pointer hover:bg-surface-hover">
            <input type="checkbox" name="scopes" value="incidents">
            <div>
              <span class="font-medium">incidents</span>
              <p class="text-xs text-muted">Full access to incidents</p>
            </div>
          </label>
          <label class="flex items-center gap-2 p-2 bg-surface rounded cursor-pointer hover:bg-surface-hover">
            <input type="checkbox" name="scopes" value="connectors">
            <div>
              <span class="font-medium">connectors</span>
              <p class="text-xs text-muted">Manage connectors</p>
            </div>
          </label>
          <label class="flex items-center gap-2 p-2 bg-surface rounded cursor-pointer hover:bg-surface-hover">
            <input type="checkbox" name="scopes" value="playbooks">
            <div>
              <span class="font-medium">playbooks</span>
              <p class="text-xs text-muted">Manage playbooks</p>
            </div>
          </label>
          <label class="flex items-center gap-2 p-2 bg-surface rounded cursor-pointer hover:bg-surface-hover">
            <input type="checkbox" name="scopes" value="settings">
            <div>
              <span class="font-medium">settings</span>
              <p class="text-xs text-muted">Access settings</p>
            </div>
          </label>
        </div>
      </div>

      <div class="form-group mt-4">
        <label class="form-label" for="api-key-expires">Expiration (optional)</label>
        <select id="api-key-expires" name="expires_in_days" class="form-input form-select">
          <option value="">Never expires</option>
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
          <option value="180">180 days</option>
          <option value="365">365 days</option>
        </select>
        <p class="text-xs text-muted mt-1">For security, consider setting an expiration date for production keys.</p>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
      <button type="submit" class="btn btn-primary">Create API Key</button>
    </div>
  </form>
</div>
</div>

<script>
function submitCreateApiKey(e) {
  e.preventDefault();
  var form = document.getElementById('add-api-key-form');
  var name = form.querySelector('input[name="name"]').value;
  var scopes = [];
  form.querySelectorAll('input[name="scopes"]:checked').forEach(function(el) {
    scopes.push(el.value);
  });
  var expiresSelect = form.querySelector('select[name="expires_in_days"]');
  var body = { name: name, scopes: scopes };
  if (expiresSelect && expiresSelect.value) {
    body.expires_in_days = parseInt(expiresSelect.value, 10);
  }
  csrfFetch('/api/api-keys', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) {
    if (r.ok) {
      return r.json().then(function(response) {
        showApiKeyCreatedModal(response.raw_key, response.name);
      });
    } else {
      return r.json().then(function(error) {
        showToast('error', 'Failed to Create Key', error.message || 'An error occurred.');
      }).catch(function() {
        showToast('error', 'Failed to Create Key', 'An unexpected error occurred.');
      });
    }
  }).catch(function(err) {
    showToast('error', 'Failed to Create Key', err.message);
  });
}

function showApiKeyCreatedModal(rawKey, keyName) {
  var container = document.getElementById('modal-container');
  // Build modal with DOM APIs to avoid XSS
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.onclick = function(e) { if (e.target === backdrop) { backdrop.remove(); location.reload(); } };

  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML =
    '<div class="modal-header"><h3 class="modal-title">API Key Created</h3></div>' +
    '<div class="modal-body">' +
      '<div class="p-4 mb-4" style="background:rgba(34,197,94,0.1);border-radius:0.375rem;">' +
        '<svg style="display:inline-block;margin-right:0.5rem;vertical-align:middle;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
          '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>' +
        '</svg>' +
        '<span class="font-semibold">Success!</span> Your API key has been created.' +
      '</div>' +
      '<div class="p-4 mb-4" style="background:rgba(234,179,8,0.1);border-radius:0.375rem;">' +
        '<svg style="display:inline-block;margin-right:0.5rem;vertical-align:middle;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
          '<path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>' +
        '</svg>' +
        '<span class="font-semibold">Important:</span> This is the only time you will see this key. Copy it now and store it securely.' +
      '</div>' +
      '<label class="form-label" for="new-api-key">Your API Key</label>' +
      '<div class="flex gap-2">' +
        '<input type="text" class="form-input font-mono" readonly id="new-api-key">' +
        '<button type="button" class="btn btn-secondary" onclick="copyApiKey()" aria-label="Copy API key">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
            '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>' +
            '<path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>' +
          '</svg> Copy' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button type="button" class="btn btn-primary" onclick="this.closest(\'.modal-backdrop\').remove(); location.reload();">Done</button>' +
    '</div>';

  backdrop.appendChild(modal);
  container.innerHTML = '';
  container.appendChild(backdrop);
  // Set the key value safely via DOM property (not innerHTML)
  document.getElementById('new-api-key').value = rawKey;
}

function copyApiKey() {
  var input = document.getElementById('new-api-key');
  input.select();
  document.execCommand('copy');
  showToast('success', 'Copied!', 'API key copied to clipboard.');
}
</script>
