<div class="modal-backdrop" id="add-hunt-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Create New Hunt</h2>
      <button class="modal-close" aria-label="Close" onclick="this.closest('.modal-backdrop').remove()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form id="create-hunt-form" onsubmit="submitCreateHunt(event)">
      <div class="modal-body">
        <div class="form-group">
          <label for="hunt-name" class="form-label">Hunt Name</label>
          <input type="text" id="hunt-name" name="name" class="form-input" placeholder="e.g., Detect Kerberoasting" required>
        </div>

        <div class="form-group">
          <label for="hunt-hypothesis" class="form-label">Hypothesis</label>
          <textarea id="hunt-hypothesis" name="hypothesis" class="form-input form-textarea" placeholder="What are you looking for and why?" rows="2" required></textarea>
        </div>

        <div class="form-group">
          <label for="hunt-description" class="form-label">Description</label>
          <textarea id="hunt-description" name="description" class="form-input form-textarea" placeholder="Detailed description of this hunt..." rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="hunt-type" class="form-label">Hunt Type</label>
          <select id="hunt-type" name="hunt_type" class="form-input form-select">
            <option value="on_demand">On-Demand</option>
            <option value="scheduled">Scheduled</option>
            <option value="continuous">Continuous</option>
            <option value="triggered">Triggered</option>
          </select>
        </div>

        <div class="form-group">
          <label for="hunt-mitre" class="form-label">MITRE ATT&amp;CK Techniques</label>
          <input type="text" id="hunt-mitre" name="mitre_techniques" class="form-input" placeholder="e.g., T1558.003, T1003.001">
          <p class="text-xs text-muted mt-1">Comma-separated technique IDs</p>
        </div>

        <div class="form-group">
          <label for="hunt-tags" class="form-label">Tags</label>
          <input type="text" id="hunt-tags" name="tags" class="form-input" placeholder="e.g., credential-access, high-priority">
          <p class="text-xs text-muted mt-1">Comma-separated tags</p>
        </div>

        <div class="form-group">
          <div class="flex items-center gap-3">
            <label class="switch">
              <input type="checkbox" id="hunt-enabled" name="enabled" value="true">
              <span class="switch-track"></span>
              <span class="switch-thumb"></span>
            </label>
            <span class="text-sm">Enable hunt immediately</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Hunt</button>
      </div>
    </form>
    <script>
    function submitCreateHunt(e) {
      e.preventDefault();
      const form = document.getElementById('create-hunt-form');
      const body = {
        name: form.querySelector('#hunt-name').value,
        hypothesis: form.querySelector('#hunt-hypothesis').value
      };
      const desc = form.querySelector('#hunt-description').value;
      if (desc) body.description = desc;
      body.hunt_type = form.querySelector('#hunt-type').value;
      const mitre = form.querySelector('#hunt-mitre').value;
      if (mitre) body.mitre_techniques = mitre.split(',').map(s => s.trim()).filter(Boolean);
      const tags = form.querySelector('#hunt-tags').value;
      if (tags) body.tags = tags.split(',').map(s => s.trim()).filter(Boolean);
      body.enabled = form.querySelector('#hunt-enabled').checked;
      fetch('/api/v1/hunts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      }).then(r => {
        if (r.ok) {
          form.closest('.modal-backdrop').remove();
          showToast('success', 'Hunt Created', 'New threat hunt has been created.');
          location.reload();
        } else { r.text().then(t => showToast('error', 'Failed to Create Hunt', t || 'Please check your configuration.')); }
      }).catch(err => showToast('error', 'Failed to Create Hunt', err.message));
    }
    </script>
  </div>
</div>
