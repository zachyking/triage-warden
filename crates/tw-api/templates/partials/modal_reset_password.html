<div class="modal-backdrop" onclick="if (event.target === this) this.remove()">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Reset Password for {{ username }}</h2>
      <button class="modal-close" onclick="this.closest('.modal-backdrop').remove()" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form id="reset-pw-form" onsubmit="submitResetPassword(event, '{{ user_id }}')">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="modal-body">
        <div class="form-group">
          <label for="new-password" class="form-label">New Password</label>
          <input type="password" id="new-password" name="password" class="form-input"
                 placeholder="Min 8 characters" required minlength="8">
        </div>
        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm_password" class="form-input"
                 placeholder="Repeat password" required minlength="8">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary">Reset Password</button>
      </div>
    </form>
    <script>
    function submitResetPassword(e, userId) {
      e.preventDefault();
      var pw = document.getElementById('new-password').value;
      var confirmPw = document.getElementById('confirm-password').value;
      if (pw !== confirmPw) { showToast('error', 'Mismatch', 'Passwords do not match.'); return; }
      csrfFetch('/api/admin/users/' + userId + '/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      }).then(function(r) {
        if (r.ok) { document.getElementById('reset-pw-form').closest('.modal-backdrop').remove(); showToast('success', 'Password Reset', 'Password has been updated.'); }
        else { return r.text().then(function(t) { showToast('error', 'Failed', t || 'Could not reset password.'); }); }
      }).catch(function(err) { showToast('error', 'Failed', err.message); });
    }
    </script>
  </div>
</div>
