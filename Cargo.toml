[workspace]
resolver = "2"
members = [
    "crates/tw-core",
    "crates/tw-policy",
    "crates/tw-connectors",
    "crates/tw-actions",
    "crates/tw-observability",
    "crates/tw-api",
    "crates/tw-cli",
    "tw-bridge",
]
default-members = [
    "crates/tw-core",
    "crates/tw-policy",
    "crates/tw-connectors",
    "crates/tw-actions",
    "crates/tw-observability",
    "crates/tw-api",
    "crates/tw-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Triage Warden Team"]
license = "MIT"
repository = "https://github.com/triage-warden/triage-warden"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"

# UUID
uuid = { version = "1.7", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.14"

# PyO3 for Python interop
pyo3 = { version = "0.24.1", features = ["extension-module"] }

# Testing
mockall = "0.12"
wiremock = "0.6"
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres", "redis"] }

# Database
# Disable sqlx default features to avoid pulling unused drivers (e.g. `any`/MySQL).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }

# Web framework
axum = { version = "0.7", features = ["json", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "catch-panic", "fs", "limit"] }
hyper = { version = "1.5", features = ["full"] }

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# Validation
validator = { version = "0.19", features = ["derive"] }

# Rate limiting
governor = "0.6"

# HMAC for webhook signatures
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "streams"] }
deadpool-redis = "0.18"

[patch.crates-io]
tower-sessions-sqlx-store = { path = "vendor/tower-sessions-sqlx-store-patched" }
sqlx-macros = { path = "vendor/sqlx-macros-patched" }
rust-xmlsec = { path = "vendor/rust-xmlsec-patched" }
xml_serde = { path = "vendor/xml_serde-patched" }

[profile.dev]
# Keep local crate debugging useful while reducing symbol size.
debug = 1
# Incremental caches are usually the largest source of target-dir growth.
incremental = false

[profile.dev.package."*"]
# Dependencies keep no debuginfo in dev builds to cap target size.
debug = 0

[profile.dev.build-override]
# Build scripts/proc-macros do not need debuginfo in normal workflows.
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

[profile.test.build-override]
debug = 0

[profile.release]
lto = true
codegen-units = 1
strip = true
