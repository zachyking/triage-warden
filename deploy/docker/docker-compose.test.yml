# Triage Warden - Integration Test Docker Compose
#
# This configuration is used for full-stack integration testing.
# It spins up all required services with test-friendly configuration.
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   cargo test --test integration_tests -- --ignored
#   docker-compose -f docker-compose.test.yml down -v

version: '3.8'

services:
  # Test PostgreSQL database
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: triage_warden_test
    ports:
      - "${TW_E2E_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d triage_warden_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests

  # Test Qdrant vector database
  qdrant-test:
    image: qdrant/qdrant:v1.15.1
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "false"  # In-memory for speed
    ports:
      - "${TW_E2E_QDRANT_HTTP_PORT:-6335}:6333"  # HTTP
      - "${TW_E2E_QDRANT_GRPC_PORT:-6336}:6334"  # gRPC
    healthcheck:
      # qdrant image does not include curl/wget; verify HTTP port 6333 is listening
      # by checking kernel TCP tables (6333 = 0x18BD).
      test: ["CMD-SHELL", "grep -q ':18BD ' /proc/net/tcp /proc/net/tcp6"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /qdrant/storage  # Use tmpfs for faster tests

  # Test Redis (for session/cache tests)
  redis-test:
    image: redis:7-alpine
    ports:
      - "${TW_E2E_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data

  # Python AI triage service in test mode
  tw-triage-test:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.triage-service
    ports:
      - "${TW_E2E_TRIAGE_PORT:-8092}:8091"
    environment:
      TW_LLM_PROVIDER: openai
      TW_LLM_MODEL: gpt-4-turbo
      # LLM keys can be set externally for integration tests
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Triage Warden API in test mode
  tw-api-test:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${TW_E2E_API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgres://test:test@postgres-test:5432/triage_warden_test
      TW_ENV: test
      TW_LOG_LEVEL: debug
      # Base64-encoded 32-byte test key (deterministic for local integration tests)
      TW_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      TW_JWT_SECRET: test_jwt_secret_for_integration_testing
      TW_SESSION_SECRET: test_session_secret_for_integration
      TW_SESSION_SECURE: "false"
