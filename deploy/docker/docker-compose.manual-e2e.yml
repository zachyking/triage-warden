# Triage Warden - Manual E2E Docker Compose
#
# This configuration is for a persistent fake-organization environment used
# during manual validation with real connector credentials and a live triage
# provider. Unlike docker-compose.test.yml, it uses named volumes instead of
# tmpfs so the bootstrapped org survives container restarts.

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: triage_warden_test
    ports:
      - "${TW_E2E_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d triage_warden_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-manual-e2e:/var/lib/postgresql/data

  qdrant-test:
    image: qdrant/qdrant:v1.15.1
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    ports:
      - "${TW_E2E_QDRANT_HTTP_PORT:-6335}:6333"
      - "${TW_E2E_QDRANT_GRPC_PORT:-6336}:6334"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD ' /proc/net/tcp /proc/net/tcp6"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - qdrant-manual-e2e:/qdrant/storage

  redis-test:
    image: redis:7-alpine
    ports:
      - "${TW_E2E_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - redis-manual-e2e:/data

  tw-triage-test:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.triage-service
    ports:
      - "${TW_E2E_TRIAGE_PORT:-8092}:8091"
    environment:
      TW_LLM_PROVIDER: ${TW_LLM_PROVIDER:-openai}
      TW_LLM_MODEL: ${TW_LLM_MODEL:-gpt-4-turbo}
      TW_LLM_API_KEY: ${TW_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  tw-api-test:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${TW_E2E_API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgres://test:test@postgres-test:5432/triage_warden_test
      TW_ENV: test
      TW_LOG_LEVEL: debug
      TW_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      TW_JWT_SECRET: test_jwt_secret_for_integration_testing
      TW_SESSION_SECRET: test_session_secret_for_integration
      TW_SESSION_SECURE: "false"
      TW_BASE_URL: http://localhost:${TW_E2E_API_PORT:-8081}
      TW_ADMIN_PASSWORD: ${TW_E2E_ADMIN_PASSWORD:-tw_e2e_admin_password}
      QDRANT_URL: http://qdrant-test:6334
      REDIS_URL: redis://redis-test:6379
      TW_TRIAGE_SERVICE_URL: http://tw-triage-test:8091
      RUST_LOG: debug,tw_api=debug,tw_core=debug
      TW_RATE_LIMIT_DISABLED: "true"
      TW_FEATURE_MULTI_TENANCY: "true"
      TW_FEATURE_WEBHOOKS: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      qdrant-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      tw-triage-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: triage-warden-manual-e2e
    driver: bridge

volumes:
  postgres-manual-e2e:
  qdrant-manual-e2e:
  redis-manual-e2e:
